<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Buzz Room - Multiplayer Trivia</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app">

    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen active">
      <div class="card home-card">
        <div class="logo">⚡</div>

        <h1>Buzz Room</h1>

        <p class="subtitle">
          Real-time multiplayer trivia
        </p>

        <div class="form-group">
          <label for="player-name">Your Name</label>
          <input
            type="text"
            id="player-name"
            placeholder="Enter your name"
            maxlength="20"
            autocomplete="off"
          />
        </div>

        <button id="host-btn" class="primary-btn">
          Host a New Game
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <div class="form-group">
          <label for="room-code-input">Room Code</label>
          <input
            type="text"
            id="room-code-input"
            placeholder="Enter 4-letter code"
            maxlength="4"
            autocomplete="off"
          />
        </div>

        <button id="join-btn" class="secondary-btn">
          Join Game
        </button>

        <p id="home-error" class="error-message"></p>
      </div>
    </section>


    <!-- LOBBY SCREEN -->
    <section id="lobby-screen" class="screen">
      <div class="card lobby-card">

        <div class="room-header">
          <div>
            <span class="small-label">ROOM CODE</span>
            <div id="room-code-display" class="room-code">
              ----
            </div>
          </div>

          <button id="copy-room-btn" class="small-btn">
            📋 Copy
          </button>
        </div>

        <div class="share-box">
          <p>Share this room code with your friends</p>
          <strong id="share-link"></strong>
        </div>

        <h2>Players</h2>

        <div id="players-list" class="players-list">
          <!-- Players will appear here -->
        </div>

        <div id="host-controls" class="host-controls hidden">
          <button id="start-game-btn" class="primary-btn">
            Start Game
          </button>
        </div>

        <p id="lobby-message" class="info-message">
          Waiting for the host to start the game...
        </p>

        <button id="leave-room-btn" class="text-btn">
          Leave Room
        </button>
      </div>
    </section>


    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen">
      <div class="game-container">

        <div class="game-topbar">
          <div>
            <span class="small-label">ROOM</span>
            <strong id="game-room-code">----</strong>
          </div>

          <div class="question-counter">
            Question
            <strong>
              <span id="current-question-number">1</span>/8
            </strong>
          </div>

          <div class="timer-box">
            ⏱ <span id="timer">10</span>
          </div>
        </div>

        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>

        <div class="card question-card">

          <div class="question-number">
            QUESTION <span id="question-index">1</span>
          </div>

          <h2 id="question-text">
            Loading question...
          </h2>

          <div id="options-container" class="options-container">
            <!-- Options inserted by JavaScript -->
          </div>

          <div id="answer-status" class="answer-status"></div>

        </div>

        <div class="card mini-leaderboard">
          <div class="leaderboard-header">
            <h3>Live Leaderboard</h3>
            <span>⚡ Live</span>
          </div>

          <div id="game-leaderboard">
            <!-- Leaderboard inserted by JavaScript -->
          </div>
        </div>

      </div>
    </section>


    <!-- RESULTS SCREEN -->
    <section id="results-screen" class="screen">
      <div class="card results-card">

        <div class="trophy">🏆</div>

        <h1>Final Standings</h1>

        <p class="subtitle">
          Great game!
        </p>

        <div id="final-leaderboard" class="final-leaderboard">
          <!-- Final results inserted by JavaScript -->
        </div>

        <div id="results-host-controls" class="host-controls hidden">
          <button id="play-again-btn" class="primary-btn">
            Play Again
          </button>
        </div>

        <button id="results-leave-btn" class="text-btn">
          Leave Room
        </button>

      </div>
    </section>


    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="loader"></div>
      <p id="loading-text">Connecting...</p>
    </div>

  </div>


  <!-- Firebase + Application -->
  <script type="module" src="script.js"></script>

</body>
</html>
